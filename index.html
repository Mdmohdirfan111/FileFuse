<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataFuse Pro - Smart Excel Automation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- PDFMake Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    
    <!-- Other Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
    <!-- Background Music Toggle -->
    <div class="music-toggle">
        <button id="musicBtn" title="Play Background Music">
            <i class="fas fa-music"></i>
        </button>
        <audio id="bgMusic" loop>
            <source src="https://assets.mixkit.co/sfx/preview/mixkit-chill-lofi-hip-hop-3099.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="container">
        <!-- Hero Header -->
        <header class="hero-header">
            <div class="logo">
                <i class="fas fa-cube"></i>
                <h1>DataFuse Pro</h1>
            </div>
            <p class="tagline">Smart Excel & PDF Automation | Built by <strong>Shabana Begum</strong></p>
            <div class="header-decoration"></div>
        </header>

        <!-- Tools Grid -->
        <div class="tools-grid">

            <!-- Tool 5: ER Generator -->
            <div class="tool-card" data-tool="5">
                <div class="tool-icon">
                    <i class="fas fa-file-invoice-dollar"></i>
                </div>
                <h2>ER Generator</h2>
                <p class="tool-desc">Generate Travel Expense Report (PDF).</p>
                <div class="er-form">
                    <div class="input-row">
                        <label>ER Month & Year</label>
                        <input type="month" id="erMonth" required>
                    </div>

                    <div class="input-row">
                        <label>Mobile Expense (₹1500 max)</label>
                        <div class="date-amount">
                            <input type="date" id="mobileDate">
                            <input type="number" id="mobileAmount" placeholder="Amount" min="0" max="1500" value="0">
                        </div>
                    </div>

                    <div class="input-row">
                        <label>Courier Expense</label>
                        <div class="date-amount">
                            <input type="date" id="courierDate">
                            <input type="number" id="courierAmount" placeholder="Amount" min="0" value="0">
                        </div>
                    </div>

                    <div class="input-row">
                        <label>Leaves/Holidays</label>
                        <div id="leaves-container"></div>
                        <button type="button" onclick="addLeaveRow()" class="action-btn small">+ Add Date</button>
                    </div>

                    <button type="button" onclick="generateER()" class="action-btn full">
                        <i class="fas fa-download"></i> Generate ER (PDF)
                    </button>
                </div>
                <div class="info-badge">Daily: ₹300 | Mobile: ₹1500 | Sunday = Week Off</div>
            </div>

            <!-- Other Tools (File Concatenator, PJP, etc.) -->
            <!-- ... (keep your existing tools) ... -->

        </div>

        <!-- Message Area -->
        <div id="message" class="message-box"></div>

        <!-- Footer -->
        <footer>
            <p>Made with <i class="fas fa-heart pulse"></i> by <strong>Shabana Begum</strong> | DataFuse Pro v2.0</p>
        </footer>
    </div>

    <!-- MAIN SCRIPT (MUST BE AT END) -->
    <script src="script.js"></script>

    <!-- Inline Script for Leaves -->
    <script>
        // Add Leave Row Function
        function addLeaveRow() {
            const container = document.getElementById('leaves-container');
            const row = document.createElement('div');
            row.className = 'leave-row';
            row.innerHTML = `
                <input type="date" class="leave-date">
                <select class="leave-type">
                    <option value="Holiday">Holiday</option>
                    <option value="Leave">Leave</option>
                </select>
            `;
            container.appendChild(row);
        }

        // Add first row by default
        document.addEventListener('DOMContentLoaded', () => {
            addLeaveRow();
        });

        // Music Toggle
        document.getElementById('musicBtn').addEventListener('click', () => {
            const bgMusic = document.getElementById('bgMusic');
            const btn = document.getElementById('musicBtn');
            if (bgMusic.paused) {
                bgMusic.play();
                btn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                bgMusic.pause();
                btn.innerHTML = '<i class="fas fa-music"></i>';
            }
        });
    </script>
</body>
</html>
